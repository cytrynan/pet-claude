target-version = "py312"
line-length = 88
extend-exclude = [".steering", "docs"]

[lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
]
# docstring・コメントの全角記号は日本語の散文なので見ない（RUF002/RUF003）。文字列（RUF001）は残す
ignore = ["RUF002", "RUF003"]
# 文字列中で意図して使う全角記号（RUF001 の誤検出を止める）。全角数字は許可しない＝要る時だけ noqa
allowed-confusables = ["（", "）", "＝", "／", "＋", "：", "・", "〜", "？", "！", "×", "，", "；"]

[lint.pycodestyle]
# E501 だけ 120 に（全角なら 60 字）。ruff は全角を幅 2 で数え、フォーマッタはコメント・docstring を
# 折り返さないので、88 のままだと日本語の散文が当たり続ける（実測: 3 日で 30 件超）。
# コードの整形幅（line-length = 88）は変えない
max-line-length = 120

[format]
quote-style = "double"
indent-style = "space"
