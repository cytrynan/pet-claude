[project]
name = "pet-claude"
version = "0.1.0"
description = "Claude Code 用の Windows デスクトップペット"
authors = [{ name = "cytrynan" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term --cov-report=html --cov-fail-under=80"

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["build/", "dist/", ".steering/"]
