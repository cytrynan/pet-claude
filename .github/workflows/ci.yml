name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest  # 対象 OS が Windows（Win32 API を使う）

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # 単独の CR（LF の付かない CR）が無いこと。CRLF は commit 時に LF へ直るが、単独の CR は直らない
      - name: Lone CR check
        run: python scripts/check-lone-cr.py

      - name: Wake word tools (Python, no numpy)
        run: python -I -m unittest discover -s scripts/wake -p "test_wake.py"

      # numpy の要る部分。onnxruntime と openWakeWord のモデルは要らない（特徴抽出は偽物に差し替える）
      - name: Wake word tools (Python, numpy)
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6
          python -I -m unittest discover -s scripts/wake -p "test_wake_np.py"

      - name: Format check
        run: cargo fmt --all --check

      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace
