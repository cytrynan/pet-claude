# Claude Code を PR / issue から呼ぶ（公式 anthropics/claude-code-action@v1）。
# - PR・issue のコメントやレビューに `@claude ...` と書くと、質問に答える・修正を別ブランチに commit する。
#   PR は自動では作らない（作成ページへのリンクを返すので、人が押す）。
# - 起動できるのはリポへの write 権限を持つ人だけ（action 側で検査）。bot からは起動しない。
# - 事前準備（リポごとに1回・人の作業）:
#   1. GitHub App を入れる: https://github.com/apps/claude （または Claude Code で /install-github-app）
#   2. Secret `CLAUDE_CODE_OAUTH_TOKEN` を置く（Pro/Max は `claude setup-token` で発行。API 従量課金なら
#      下の claude_code_oauth_token を anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} に置き換える）
# - 実行はこのリポの GitHub ランナー上。消費は発行元アカウントの利用枠から引かれる。
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # PR の CI 結果を読むため
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # テストや lint を Claude に走らせたいなら、スタックのコマンドだけを許可する（例は node）。
          # claude_args: |
          #   --allowedTools "Bash(npm ci),Bash(npm run lint),Bash(npm run typecheck),Bash(npm test)"
