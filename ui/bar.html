<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>pet-claude bar</title>
<link rel="stylesheet" href="ui.css">
<style>
  .bar { display: flex; align-items: center; gap: 2px; padding: 0 6px; }
  .sep { width: 1px; height: 18px; background: var(--separator); margin: 0 2px; }
  /* 録音中: 赤く脈打つ（もう一度押すと止めて送る） */
  #voice.recording { color: #ff3b30; animation: pulse 1.2s var(--ease) infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { #voice.recording { animation: none; } }
  @media (prefers-color-scheme: dark) { #voice.recording { color: #ff453a; } }
</style>
</head>
<body>
<div class="island capsule bar" role="toolbar" aria-label="ペットの操作">
  <button class="icon-btn" id="chat" title="チャット" aria-label="チャット">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
  </button>
  <span class="sep" aria-hidden="true"></span>
  <button class="icon-btn" id="voice" title="音声入力" aria-label="音声入力">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>
  </button>
</div>
<script src="ui.js"></script>
<script>
  document.getElementById("chat").onclick = () => invoke("ui_action", { action: "chat" });
  const voice = document.getElementById("voice");
  voice.onclick = () => invoke("ui_action", { action: "voice" });
  // Rust 側（ui.rs の refresh_bar）から: { recording }
  window.renderBar = (s) => {
    const on = !!(s && s.recording);
    voice.classList.toggle("recording", on);
    voice.title = on ? "止めて送る" : "音声入力";
    voice.setAttribute("aria-label", voice.title);
  };
</script>
</body>
</html>
