<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>pet-claude chat</title>
<link rel="stylesheet" href="ui.css">
<style>
  /* 入力の島: 上の行に入力欄、下の行にモードとモデルの切替（Claude デスクトップアプリの入力欄を写す。2026-10-27）。
     高さは ui.rs の CHAT_ISLAND = 80px（48＋32）。2 行なのでカプセルでなく角丸 16 */
  .chat { display: flex; flex-direction: column; padding: 0 6px; top: auto; height: 80px; border-radius: 16px; }
  .line { display: flex; align-items: center; gap: 4px; height: 48px; }
  input {
    flex: 1; min-width: 0; height: 36px;
    border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 14px; color: var(--label);
    padding: 0 4px;
  }
  input::placeholder { color: var(--label-2); }
  .send {
    width: 32px; height: 32px; border: 0; border-radius: 999px;
    background: var(--tint); color: #fff;
    display: grid; place-items: center;
    transition: opacity .15s var(--ease);
  }
  .send:disabled { opacity: .35; }
  .send:not(:disabled):active { opacity: .8; }
  .send svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none;
    stroke-linecap: round; stroke-linejoin: round; }
  #attach:disabled { opacity: .35; }
  /* 切替の行: 左にモード、右にモデル＋エフォート。面なしの小さなボタン（12px・`--label-2`）。押すと上にメニュー */
  .opts { display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 2px 4px; }
  .opt { height: 24px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent;
    font: inherit; font-size: 12px; color: var(--label-2); font-feature-settings: "palt";
    display: inline-flex; align-items: center; gap: 5px; transition: background-color .15s var(--ease); }
  .opt:hover, .opt[aria-expanded="true"] { background: var(--surface-hover); color: var(--label); }
  .opt:active { background: var(--surface-press); }
  .opt:focus-visible { outline: 2px solid var(--tint); outline-offset: 1px; }
  /* 最後の答え（入力欄の上。高さは ui.rs の CHAT_ANSWER_HEIGHT = 188px、入力欄との間 8px）。
     文は読ませるので不透明の面。全文を折り返し、長ければ中でスクロール */
  .answer { bottom: calc(12px + 80px + 8px); border-radius: 16px; background: var(--surface-solid);
    display: flex; flex-direction: column; }
  .answer[hidden] { display: none; }
  .answer header { display: flex; align-items: center; justify-content: space-between;
    height: 36px; padding: 0 6px 0 14px; flex: none; }
  .answer h1 { font-size: 11px; font-weight: 600; color: var(--label-2); font-feature-settings: "palt"; }
  .answer .new { height: 28px; padding: 0 10px; border: 0; border-radius: 999px; background: transparent;
    font: inherit; font-size: 12px; color: var(--label-2); font-feature-settings: "palt";
    transition: background-color .15s var(--ease); }
  .answer .new:hover { background: var(--surface-hover); }
  .answer .new:active { background: var(--surface-press); }
  .answer .new:focus-visible { outline: 2px solid var(--tint); outline-offset: 1px; }
  .answer .text { flex: 1; overflow-y: auto; padding: 0 14px 12px; line-height: 20px;
    white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; cursor: text; }
  .answer.error .text, .answer.busy .text { color: var(--label-2); }
  /* 切替のメニュー: 入力の島の上 8px に浮く島。top は auto（.island の inset: 12px の top を外す。外さないと窓の
     高さまで伸び、Rust に伝える offsetHeight が窓の高さになって循環する＝2026-10-28 撮影で下に空きが出て気づいた）（角丸 12・内側 5。右クリックメニューと同じ）。答えの欄に重ねて出す。
     面は読ませる文（説明）があるので不透明。開いている間、外を押すと閉じる（scrim） */
  .scrim { position: absolute; inset: 0; z-index: 1; }
  .scrim[hidden] { display: none; }
  .menu { position: absolute; top: auto; bottom: calc(12px + 80px + 8px); inset-inline: auto; width: 280px; z-index: 2;
    border-radius: 12px; padding: 5px; background: var(--surface-solid); display: flex; flex-direction: column; }
  .menu.left { left: 12px; }
  .menu.right { right: 12px; }
  .menu[hidden] { display: none; }
  .menu h1 { font-size: 11px; font-weight: 600; color: var(--label-2); font-feature-settings: "palt";
    display: flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px 0 6px; }
  .menu h1 .back { width: 20px; height: 20px; border: 0; border-radius: 6px; background: transparent; color: var(--label-2);
    display: grid; place-items: center; }
  .menu h1 .back:hover { background: var(--surface-hover); color: var(--label); }
  .menu h1 .back svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .menu h1 .back[hidden] { display: none; }
  /* 行は縦に並べて幅いっぱいに（button は中身の幅に縮むので、親を flex の列にして伸ばす） */
  #menu-items { display: flex; flex-direction: column; }
  .mi { min-height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--label);
    display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px;
    font: inherit; font-feature-settings: "palt"; text-align: left; transition: background-color .1s var(--ease); }
  .mi.two { min-height: 44px; padding-top: 5px; padding-bottom: 5px; }
  .mi:hover { background: var(--surface-hover); }
  .mi:active { background: var(--surface-press); }
  .mi:focus-visible { outline: 2px solid var(--tint); outline-offset: -2px; }
  .mi .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .mi .desc { font-size: 11px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mi .val { color: var(--label-2); }
  .mi .check { width: 14px; height: 14px; flex: none; stroke: currentColor; stroke-width: 2.2; fill: none;
    stroke-linecap: round; stroke-linejoin: round; visibility: hidden; }
  .mi[aria-checked="true"] .check { visibility: visible; }
  .mi .num { font-size: 11px; color: var(--label-2); font-variant-numeric: tabular-nums; min-width: 1em; text-align: right; }
  .mi .chev { width: 12px; height: 12px; flex: none; stroke: var(--label-2); stroke-width: 2; fill: none;
    stroke-linecap: round; stroke-linejoin: round; }
  .msep { height: 1px; background: var(--separator); margin: 4px 8px; }
</style>
</head>
<body>
<section class="island answer" id="answer" hidden aria-live="polite">
  <header>
    <h1 id="answer-title">こたえ</h1>
    <button type="button" class="new" id="new" title="会話を忘れて最初から">新しいチャット</button>
  </header>
  <div class="text" id="answer-text"></div>
</section>
<div class="island chat" id="chat">
  <form class="line" id="form" autocomplete="off">
    <button type="button" class="icon-btn" id="attach" title="添付（まだ使えません）" aria-label="添付" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <input id="text" placeholder="新しいチャットを開始" aria-label="メッセージ" maxlength="2000">
    <button type="submit" class="send" id="send" title="送信" aria-label="送信" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
    </button>
  </form>
  <div class="opts">
    <button type="button" class="opt" id="mode-btn" aria-haspopup="menu" aria-expanded="false" title="モード"></button>
    <button type="button" class="opt" id="model-btn" aria-haspopup="menu" aria-expanded="false" title="モデルとエフォート"></button>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="island menu" id="menu" role="menu" hidden>
  <h1><button type="button" class="back" id="back" aria-label="戻る" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span id="menu-title"></span></h1>
  <div id="menu-items"></div>
</div>
<script src="ui.js"></script>
<script src="options.js"></script>
<script>
  const text = document.getElementById("text");
  const send = document.getElementById("send");
  const answer = document.getElementById("answer");
  const answerText = document.getElementById("answer-text");
  const answerTitle = document.getElementById("answer-title");
  const newBtn = document.getElementById("new");
  // 質問への「回答」の入力中（ui.rs の chat_state の ask: {id, question}）。送信は ask_action に向ける
  window.__ask = null;
  const idle = "新しいチャットを開始";
  const followUp = "続けて話す";
  let busy = false;
  const update = () => { send.disabled = (busy && !window.__ask) || text.value.trim() === ""; };
  text.addEventListener("input", update);
  // ---- モード・モデル・エフォートの切替（このチャットの間だけ。Rust 側 chat::set_options） ----
  const modeBtn = document.getElementById("mode-btn");
  const modelBtn = document.getElementById("model-btn");
  const menu = document.getElementById("menu");
  const menuTitle = document.getElementById("menu-title");
  const menuItems = document.getElementById("menu-items");
  const back = document.getElementById("back");
  const scrim = document.getElementById("scrim");
  let opts = { ...CHAT_DEFAULTS };
  let open = null; // "mode" | "model" | "effort"
  const renderOpts = () => {
    modeBtn.textContent = chatLabel(CHAT_MODES, opts.mode, CHAT_DEFAULTS.mode);
    modelBtn.replaceChildren(
      chatLabel(CHAT_MODELS, opts.model, CHAT_DEFAULTS.model),
      Object.assign(document.createElement("span"), { textContent: chatLabel(CHAT_EFFORTS, opts.effort, CHAT_DEFAULTS.effort) }),
    );
  };
  const svg = (cls, d) => {
    const el = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    el.setAttribute("viewBox", "0 0 24 24"); el.setAttribute("aria-hidden", "true"); el.setAttribute("class", cls);
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", d); el.append(p);
    return el;
  };
  const CHECK = "M5 12.5l4.5 4.5L19 7";
  const CHEV = "M9 6l6 6-6 6";
  // 1 行（名前・説明・右端にチェックと番号）。番号はキーボードでも選べる印（Claude アプリと同じ）
  const row = (i, label, desc, checked, onPick) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "mi" + (desc ? " two" : ""); b.setAttribute("role", "menuitemradio");
    b.setAttribute("aria-checked", checked ? "true" : "false"); b.dataset.i = String(i + 1);
    const body = document.createElement("span"); body.className = "body";
    body.append(Object.assign(document.createElement("span"), { textContent: label }));
    if (desc) body.append(Object.assign(document.createElement("span"), { className: "desc", textContent: desc }));
    b.append(body, svg("check", CHECK), Object.assign(document.createElement("span"), { className: "num", textContent: String(i + 1) }));
    b.addEventListener("click", onPick);
    return b;
  };
  const pick = async (field, value) => {
    const got = await invoke("chat_options_set", { [field]: value });
    if (got && typeof got === "object") opts = { ...opts, ...got };
    renderOpts();
    closeMenu();
  };
  const build = (kind) => {
    open = kind;
    back.hidden = kind !== "effort";
    menu.classList.toggle("left", kind === "mode");
    menu.classList.toggle("right", kind !== "mode");
    const items = [];
    if (kind === "mode") {
      menuTitle.textContent = "モード";
      CHAT_MODES.forEach(([v, name, desc], i) => items.push(row(i, name, desc, opts.mode === v, () => pick("mode", v))));
    } else if (kind === "model") {
      menuTitle.textContent = "モデル";
      CHAT_MODELS.forEach(([v, name], i) => items.push(row(i, name, "", opts.model === v, () => pick("model", v))));
      items.push(Object.assign(document.createElement("div"), { className: "msep" }));
      // 「エフォート　高 ›」: 押すと同じ島の中でエフォートの一覧に替わる（横に出す場所が無いため）
      const e = document.createElement("button");
      e.type = "button"; e.className = "mi"; e.setAttribute("role", "menuitem"); e.setAttribute("aria-haspopup", "menu");
      e.append(Object.assign(document.createElement("span"), { className: "body", textContent: "エフォート" }),
        Object.assign(document.createElement("span"), { className: "val", textContent: chatLabel(CHAT_EFFORTS, opts.effort, CHAT_DEFAULTS.effort) }),
        svg("chev", CHEV));
      e.addEventListener("click", () => build("effort"));
      items.push(e);
    } else {
      menuTitle.textContent = "エフォート";
      CHAT_EFFORTS.forEach(([v, name], i) => items.push(row(i, name, "", opts.effort === v, () => pick("effort", v))));
    }
    menuItems.replaceChildren(...items);
    menu.hidden = false;
    scrim.hidden = false;
    modeBtn.setAttribute("aria-expanded", kind === "mode" ? "true" : "false");
    modelBtn.setAttribute("aria-expanded", kind !== "mode" ? "true" : "false");
    // 窓をメニューの分だけ広げてもらう（答えの欄より高い分。ui.rs の set_chat_menu_height）
    invoke("chat_menu", { height: menu.offsetHeight });
    const first = menuItems.querySelector('[aria-checked="true"]') || menuItems.querySelector(".mi");
    if (first) first.focus();
  };
  const closeMenu = () => {
    if (!open) return;
    open = null;
    menu.hidden = true;
    scrim.hidden = true;
    modeBtn.setAttribute("aria-expanded", "false");
    modelBtn.setAttribute("aria-expanded", "false");
    invoke("chat_menu", { height: 0 });
    text.focus();
  };
  modeBtn.addEventListener("click", () => (open === "mode" ? closeMenu() : build("mode")));
  modelBtn.addEventListener("click", () => (open && open !== "mode" ? closeMenu() : build("model")));
  back.addEventListener("click", () => build("model"));
  scrim.addEventListener("mousedown", closeMenu);
  // Esc と数字キー（ui.js の Esc より先に受ける。閉じるだけで、Esc を窓の操作に渡さない）
  window.addEventListener("keydown", (e) => {
    if (!open) return;
    if (e.key === "Escape") { e.stopImmediatePropagation(); e.preventDefault(); closeMenu(); return; }
    const hit = /^[1-9]$/.test(e.key) && menuItems.querySelector(`[data-i="${e.key}"]`);
    if (hit) { e.preventDefault(); hit.click(); }
  }, true);
  window.addEventListener("blur", closeMenu);
  renderOpts();
  // Rust 側（ui.rs の chat_state）から: { answer, error, busy, heard, ask, options }
  // （heard は音声入力で聞き取った文、options はいま効いているモデル・エフォート・モード）
  window.renderChat = (s) => {
    busy = !!(s && s.busy);
    if (s && s.options && typeof s.options === "object") { opts = { ...CHAT_DEFAULTS, ...s.options }; renderOpts(); }
    const ask = s && s.ask && typeof s.ask.question === "string" ? s.ask : null;
    window.__ask = ask;
    const has = s && typeof s.answer === "string";
    // 待ち中は答えが無くても欄を出す（「新しいチャット」で取り消せるように）。質問への回答中は質問文を出す
    answer.hidden = !has && !busy && !ask;
    answer.classList.toggle("error", !ask && !!(s && s.error));
    answerTitle.textContent = ask ? "質問" : "こたえ";
    newBtn.hidden = !!ask;
    const said = s && typeof s.heard === "string" ? "「" + s.heard + "」\n\n" : "";
    answerText.textContent = ask ? ask.question : said + (busy ? "考え中…" : (has ? s.answer : ""));
    answer.classList.toggle("busy", busy && !ask);
    answerText.scrollTop = 0;
    text.placeholder = ask ? "答えを打って送る" : (busy ? "考え中…" : (has && !s.error ? followUp : idle));
    update();
  };
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const value = text.value.trim();
    if (!value) return;
    if (window.__ask) {
      // 質問への回答: Rust 側が受け付けたら "ok"（カードが次の質問に進むか、全部答えてチャット欄が閉じる）
      const reply = await invoke("ask_action", { id: window.__ask.id, action: "answer", value });
      if (reply === "ok") text.value = "";
      else if (reply) text.placeholder = reply;
      update();
      return;
    }
    if (busy) return;
    const reply = await invoke("chat_submit", { text: value });
    // 受け付けられたら打った文を消す。断られた（まだ考え中・長すぎる）時は残す。
    // 待ち中かどうかは Rust 側の renderChat だけで決める（この応答は答えの描き直しより遅く届くことがあり、
    // ここで busy を立てると待ちのまま固まった。2026-10-21 検証係 2 巡目の指摘）
    if (reply === "考え中…") {
      text.value = "";
    } else if (reply) {
      text.placeholder = reply;
    }
    update();
  });
  document.getElementById("new").addEventListener("click", () => {
    closeMenu();
    invoke("ui_action", { action: "chat:new" });
    text.focus();
  });
  // 表示のたびに入力欄へフォーカス（Rust 側が show の後に呼ぶ）
  window.focusInput = () => { text.focus(); };
  window.addEventListener("focus", () => { if (!open) text.focus(); });
  invoke("chat_state").then(window.renderChat);
</script>
</body>
</html>
