<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>pet-claude menu</title>
<link rel="stylesheet" href="ui.css">
<style>
  .menu { border-radius: 12px; padding: 5px; display: flex; flex-direction: column; }
  .item {
    height: 32px; border: 0; border-radius: 8px;
    background: transparent; color: var(--label);
    display: flex; align-items: center; gap: 10px; padding: 0 10px;
    font: inherit; font-feature-settings: "palt"; text-align: left;
    transition: background-color .1s var(--ease);
  }
  .item:hover { background: var(--surface-hover); }
  .item:active { background: var(--surface-press); }
  .item:disabled { color: var(--label-2); background: transparent; }
  .item svg { width: 16px; height: 16px; flex: none; stroke: currentColor; stroke-width: 1.6; fill: none;
    stroke-linecap: round; stroke-linejoin: round; }
  .sep { height: 1px; background: var(--separator); margin: 4px 8px; }
</style>
</head>
<body>
<div class="island menu" role="menu" aria-label="ペットのメニュー">
  <button class="item" role="menuitem" data-action="menu:settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>
    設定
  </button>
  <button class="item" role="menuitem" data-action="menu:hide-bar" id="hide-bar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 8.5 4.5 9 6-.3.9-1.2 2.3-2.6 3.6M6.6 6.6C4.5 8 3.3 10.1 3 12c.5 1.5 4 6 9 6 1.6 0 3-.4 4.2-1"/></svg>
    バーを隠す
  </button>
  <button class="item" role="menuitem" data-action="menu:reset">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v4h4"/></svg>
    位置をリセット
  </button>
  <div class="sep" role="separator"></div>
  <button class="item" role="menuitem" data-action="menu:quit">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v8"/><path d="M7 7.5a7 7 0 1 0 10 0"/></svg>
    終了
  </button>
</div>
<script src="ui.js"></script>
<script>
  for (const b of document.querySelectorAll("[data-action]")) {
    b.onclick = () => invoke("ui_action", { action: b.dataset.action });
  }
  // Rust 側が表示の直前に呼ぶ: バーが出ていないときは「バーを隠す」を押せなくする
  window.setBarShown = (shown) => { document.getElementById("hide-bar").disabled = !shown; };
  // 窓を作った直後は Rust からの eval が読み込み前で空振りするので、読み込んだら自分で聞く
  invoke("bar_shown").then(window.setBarShown);
</script>
</body>
</html>
