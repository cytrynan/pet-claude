<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>pet-claude の設定</title>
<link rel="stylesheet" href="ui.css">
<style>
  :root { --bg-grouped: #f2f2f7; --cell: #fff; --green: #34c759; }
  @media (prefers-color-scheme: dark) { :root { --bg-grouped: #000; --cell: #1c1c1e; --green: #30d158; } }
  html, body { background: var(--bg-grouped); overflow: auto; }
  main { padding: 20px 16px 24px; }
  h2 { font-size: 11px; font-weight: 600; color: var(--label-2); letter-spacing: .02em;
    margin: 18px 16px 6px; font-feature-settings: "palt"; }
  h2:first-child { margin-top: 0; }
  .group { background: var(--cell); border-radius: 10px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 8px 16px; }
  .row + .row { border-top: .5px solid var(--separator); }
  .row label { flex: 1; font-feature-settings: "palt"; }
  .note { font-size: 11px; color: var(--label-2); margin: 6px 16px 0; line-height: 1.5; }
  .value { color: var(--label-2); min-width: 3.5em; text-align: right; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 160px; accent-color: var(--tint); }
  /* ポップアップボタン（行の右端で値を選ぶ。HIG の pop-up button を写す: 塗りのカプセル・右に山形） */
  .popup { position: relative; display: inline-flex; align-items: center; }
  .popup select {
    appearance: none; field-sizing: content; max-width: 220px;
    height: 28px; padding: 0 28px 0 12px; border: 0; border-radius: 8px;
    font: inherit; font-feature-settings: "palt"; color: var(--label);
    background: var(--surface-hover); cursor: default;
  }
  .popup select:hover { background: var(--surface-press); }
  .popup select:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
  /* 選択肢の一覧は WebView2 が別の窓で描き、その明暗が本文と食い違うことがある。文字色だけ継ぐと
     暗い配色のとき白地に白文字で読めなくなった（2026-10-27 K報告）。地色も明示して組で揃える */
  .popup option { color: var(--label); background: var(--cell); }
  .popup::after {
    content: ""; position: absolute; right: 11px; top: 50%; width: 6px; height: 6px; margin-top: -5px;
    border-right: 1.5px solid var(--label-2); border-bottom: 1.5px solid var(--label-2);
    transform: rotate(45deg); pointer-events: none;
  }
  /* スイッチ（HIG: 51×31・オンは緑・白いつまみ） */
  .switch { appearance: none; width: 51px; height: 31px; border-radius: 999px; flex: none;
    background: rgba(120, 120, 128, .32); position: relative; transition: background-color .2s var(--ease); }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px;
    border-radius: 999px; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .15);
    transition: transform .2s var(--ease); }
  .switch:checked { background: var(--green); }
  .switch:checked::after { transform: translateX(20px); }
  .switch:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .switch, .switch::after { transition: none; } }
  /* 行の中の小さなボタン（HIG の bordered button を写す: 灰の塗り・角丸 8・高さ 28） */
  .btn { height: 28px; padding: 0 12px; border: 0; border-radius: 8px; flex: none;
    font: inherit; font-feature-settings: "palt"; color: var(--label); background: var(--surface-hover); }
  .btn:hover { background: var(--surface-press); }
  .btn:disabled { opacity: .4; }
  .btn:focus-visible, .key:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
  .key { flex: 1; min-width: 0; height: 28px; padding: 0 10px; border: 0; border-radius: 8px;
    font: inherit; color: var(--label); background: var(--surface-hover); outline: 0; }
  .status { color: var(--label-2); font-feature-settings: "palt"; text-align: right; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h2>表示</h2>
  <div class="group">
    <div class="row">
      <label for="pet">ペット</label>
      <span class="popup"><select id="pet"></select></span>
    </div>
    <!-- 選んだペットの呼びかけの言葉（pet.json の wakeWord。ペットごとに決まるので読むだけ。2026-10-22 K 指示） -->
    <div class="row">
      <label>ウェイクワード</label>
      <span class="status" id="wake-word"></span>
    </div>
    <div class="row">
      <label for="scale">ペットの大きさ</label>
      <input type="range" id="scale" min="25" max="150" step="5">
      <span class="value" id="scale-value"></span>
    </div>
    <div class="row">
      <label for="walk">放置すると散歩する</label>
      <input type="checkbox" class="switch" id="walk" role="switch">
    </div>
  </div>

  <h2>起動</h2>
  <div class="group">
    <!-- 実物はタスク スケジューラ（pet-claude）。開くたびに読み直す（Phase 4・PRD N5） -->
    <div class="row">
      <label for="autostart">サインインしたらペットを出す</label>
      <input type="checkbox" class="switch" id="autostart" role="switch" disabled>
    </div>
  </div>
  <p class="note" id="autostart-status" hidden></p>

  <h2>Claude Code</h2>
  <div class="group">
    <!-- 質問（AskUserQuestion）を吹き出しのカードで答える（K 指示 2026-10-27・既定オン） -->
    <div class="row">
      <label for="ask">質問にペットで答える</label>
      <input type="checkbox" class="switch" id="ask" role="switch">
    </div>
  </div>
  <p class="note">オフのときは「聞きたいことがあるよ」と知らせるだけで、質問には Claude Code の画面で答えます。</p>

  <h2>声</h2>
  <div class="group">
    <div class="row">
      <label for="tts">声で知らせる</label>
      <input type="checkbox" class="switch" id="tts" role="switch">
    </div>
    <div class="row">
      <label>読み上げ</label>
      <span class="status" id="tts-status">確かめています…</span>
    </div>
    <div class="row">
      <label>音声入力</label>
      <span class="status" id="stt-status">確かめています…</span>
    </div>
    <div class="row">
      <label for="wake">呼びかけで音声入力を始める</label>
      <input type="checkbox" class="switch" id="wake" role="switch">
    </div>
  </div>
  <p class="note">呼びかけで音声入力を始めるのは Phase 4 で使えます（設定は保存されます）。</p>

  <h2>チャット</h2>
  <div class="group">
    <div class="row">
      <label for="auth">接続</label>
      <span class="popup"><select id="auth">
        <option value="subscription">サブスク</option>
        <option value="api_key">API キー</option>
      </select></span>
    </div>
    <div class="row" id="key-row" hidden>
      <label for="key" id="key-label">API キー</label>
      <input type="password" class="key" id="key" placeholder="sk-ant-…" autocomplete="off" spellcheck="false">
      <span class="status" id="key-saved" hidden>保存済み</span>
      <button type="button" class="btn" id="key-save" disabled>保存</button>
      <button type="button" class="btn" id="key-delete" hidden>削除</button>
    </div>
    <div class="row">
      <label>いまの接続</label>
      <span class="status" id="check-result"></span>
      <button type="button" class="btn" id="check">確かめる</button>
    </div>
  </div>
  <p class="note">サブスクは Claude Code にログインしているアカウントで答えます。API キーは使った分だけ課金され、鍵は Windows の資格情報マネージャーに保存します。</p>
</main>
<script src="ui.js"></script>
<script>
  const scale = document.getElementById("scale");
  const scaleValue = document.getElementById("scale-value");
  const tts = document.getElementById("tts");
  const wake = document.getElementById("wake");
  const walk = document.getElementById("walk");
  const ask = document.getElementById("ask");
  const pet = document.getElementById("pet");
  const show = () => { scaleValue.textContent = scale.value + "%"; };
  // スライダーを動かしている間は描き直すだけ（save: false）、離したら保存する
  const send = (persist) => invoke("settings_set", {
    scale: Number(scale.value) / 100, tts: tts.checked, wake: wake.checked, walk: walk.checked, ask: ask.checked, save: persist,
  });
  const save = () => send(true);
  const wakeWord = document.getElementById("wake-word");
  let petList = [];
  // 選択欄で選んでいるペットのウェイクワード。決めていないペット（仮キャラなど）は「なし」
  const showWakeWord = () => {
    const p = petList.find((q) => q.id === pet.value);
    wakeWord.textContent = (p && p.wakeWord) || "なし";
  };
  // ペットの一覧は開くたびに作り直す（フォルダに足したペットも次に開いたとき出る）
  const fillPets = (s) => {
    petList = s.pets || [];
    pet.replaceChildren(...petList.map((p) => {
      const o = document.createElement("option");
      o.value = p.id;
      o.textContent = p.name;
      return o;
    }));
    pet.value = s.pet;
    showWakeWord();
  };
  // ---- チャットの接続（鍵は画面に読み返さない。保存されているかだけ受け取る） ----
  const auth = document.getElementById("auth");
  const keyRow = document.getElementById("key-row");
  const key = document.getElementById("key");
  const keySave = document.getElementById("key-save");
  const keyDelete = document.getElementById("key-delete");
  const keySaved = document.getElementById("key-saved");
  const checkResult = document.getElementById("check-result");
  const check = document.getElementById("check");
  const showAuth = (mode, hasKey) => {
    auth.value = mode;
    keyRow.hidden = mode !== "api_key";
    key.hidden = hasKey;
    keySave.hidden = hasKey;
    keySaved.hidden = !hasKey;
    keyDelete.hidden = !hasKey;
    checkResult.textContent = "";
  };
  auth.addEventListener("change", () => {
    invoke("chat_auth_set", { mode: auth.value });
    invoke("settings_get").then((s) => showAuth(auth.value, s.hasApiKey));
  });
  key.addEventListener("input", () => { keySave.disabled = key.value.trim() === ""; });
  keySave.addEventListener("click", async () => {
    const ok = await invoke("chat_key_save", { key: key.value });
    key.value = "";
    keySave.disabled = true;
    showAuth(auth.value, ok);
    if (!ok) checkResult.textContent = "保存できませんでした";
  });
  keyDelete.addEventListener("click", async () => {
    // 消せなかったら「保存済み」のまま理由を出す（消えたように見せない）
    const ok = await invoke("chat_key_delete");
    showAuth(auth.value, !ok);
    if (!ok) checkResult.textContent = "削除できませんでした";
  });
  check.addEventListener("click", async () => {
    check.disabled = true;
    checkResult.textContent = "確かめています…";
    checkResult.textContent = await invoke("chat_auth_check", { mode: auth.value });
    check.disabled = false;
  });
  // ---- 自動起動（Windows タスク）。スイッチは実物の状態に合わせて戻す（登録に失敗したらオフに戻る） ----
  const autostart = document.getElementById("autostart");
  const autostartStatus = document.getElementById("autostart-status");
  const showAutostart = (a) => {
    if (!a) return;
    autostart.checked = a.state === "on";
    autostart.disabled = false;
    const text = a.state === "other" ? "別の場所の pet-app が登録されています。オンにすると、いま動いているものに置き換えます"
      : a.state === "error" ? "登録できませんでした: " + a.detail
      : "";
    autostartStatus.textContent = text;
    autostartStatus.title = a.state === "other" ? a.detail : "";
    autostartStatus.hidden = text === "";
  };
  autostart.addEventListener("change", async () => {
    autostart.disabled = true;
    showAutostart(await invoke("autostart_set", { on: autostart.checked }));
  });
  window.reload = () => invoke("settings_get").then((s) => {
    invoke("autostart_get").then(showAutostart);
    scale.value = Math.round(s.scale * 100);
    tts.checked = s.tts;
    wake.checked = s.wake;
    walk.checked = s.walk;
    ask.checked = s.ask !== false;
    fillPets(s);
    showAuth(s.chatAuth || "subscription", !!s.hasApiKey);
    show();
    // 声の状態はエンジンに問い合わせるので後から埋める（最大 2 秒）
    invoke("voice_status").then((v) => {
      document.getElementById("tts-status").textContent = (v && v.tts) || "確かめられませんでした";
      document.getElementById("stt-status").textContent = (v && v.stt) || "確かめられませんでした";
    });
  });
  window.reload();
  scale.addEventListener("input", () => { show(); send(false); });
  scale.addEventListener("change", save);
  tts.addEventListener("change", save);
  wake.addEventListener("change", save);
  walk.addEventListener("change", save);
  ask.addEventListener("change", save);
  // 読み込みは別スレッドで 1〜2 秒かかる。読めないペットだったときに選択欄が戻るよう、少し後に聞き直す
  // 聞き直すのはペットの選択欄だけ（ほかのスイッチやスライダーを古い値で巻き戻さない）。その間に
  // 別のペットを選び直していたら触らない（新しいほうの聞き直しに任せる。2026-10-21 検証係の指摘）。
  // select は選んだ後もフォーカスを持ち続けるので、フォーカスでは判定しない
  pet.addEventListener("change", () => {
    const picked = pet.value;
    showWakeWord();
    invoke("pet_set", { id: picked });
    setTimeout(() => {
      if (pet.value !== picked) return;
      invoke("settings_get").then(fillPets);
    }, 2500);
  });
</script>
</body>
</html>
