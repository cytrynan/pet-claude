[package]
name = "pet-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
pet-core = { version = "0.1.0", path = "../pet-core" }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = ["tray-icon"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_UI_Input", "Win32_Security_Cryptography", "Win32_Security_Credentials", "Win32_System_JobObjects"] }

[build-dependencies]
tauri-build = "2.7.3"

[lints]
workspace = true
